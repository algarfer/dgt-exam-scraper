name: Update exams

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-exams
  cancel-in-progress: false

jobs:
  canary:
    name: Check upstream markup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Typecheck
        run: uv run mypy

      - name: Re-parse a random committed exam
        run: uv run pytest -v

  update:
    name: Scrape newly published exams
    runs-on: ubuntu-latest
    needs: canary
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Look for new exams
        run: uv run dgt-scraper --verbose latest

      - name: Commit new exams
        run: |
          if [ -z "$(git status --porcelain dist)" ]; then
            echo "dist/ unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          added=$(git diff --cached --name-only --diff-filter=A -- 'dist/exam-*/index.json' \
            | sed -E 's|dist/exam-([0-9]+)/index.json|\1|' | sort -n | tr '\n' ' ')
          if [ "$(echo "$added" | wc -w)" = "1" ]; then
            git commit -m "feat(data): add exam ${added% }"
          else
            git commit -m "chore(data): refresh exams"
          fi
          git push
